[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfxmlextentreview"
version = "1.0.2"
authors = [{ name = "dhtfish98" }]
description = "Bounded offline evidence review: DfxmlExtentReview"
requires-python = ">=3.10"
license = "MIT"
license-files = ["项目文档/LICENSE", "THIRD_PARTY_LICENSE.txt", "NEW_IMPLEMENTATION_NOTICE.txt"]
dependencies = []

[project.scripts]
dfxmlextentreview = "dfxmlextentreview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
